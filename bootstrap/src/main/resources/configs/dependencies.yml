# 外部依赖的配置，都写在本文件内
---
# 统一认证头名称
AUTH_HEADER_NAME: "Authorization"

# 接口文档
nextdoc4j:
  enabled: ${helium.openapi3.nextdoc4j.enabled}
  auth:
    enabled: true
    password: "helium"
  plugin:
    security:
      enabled: true
springdoc:
  # 平铺显示复合入参对象
  default-flat-param-object: true
  components:
    security-schemes:
      # 接口文档安全方案，基础的只有请求头传递 Bearer Token
      ${AUTH_HEADER_NAME}:
        type: HTTP
        in: HEADER
        name: ${AUTH_HEADER_NAME}
        scheme: Bearer
        description: "请输入 Bearer Token，格式：Bearer {token}"

---
# SA-Token；详细配置文档：https://sa-token.cc/doc.html#/use/config
sa-token:
  # token名称
  token-name: ${AUTH_HEADER_NAME}
  # token风格
  token-style: tik
  # token前缀；注意最后不要手动加空格
  token-prefix: "Bearer"
  # 是否允许同一账号并发登录
  is-concurrent: false
  # 打印banner
  is-print: false
  # 是否尝试从请求体里读取token
  is-read-body: false
  # 是否尝试从cookie里读取token
  is-read-cookie: false
  # 有效期解释：https://sa-token.cc/doc.html#/fun/token-timeout
  # token 有效期，单位=秒；默认30天，-1代表永不过期
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1

---
# MyBatis-Plus
mybatis-plus:
  # XML扫描，支持通配符 * 或者 , 分割
  mapper-locations: classpath*:/mapper/**/*.xml, classpath*:/**/mapper/xml/*.xml
  global-config:
    # 启动时不打印字符画
    banner: false
