# Helium 框架层相关的配置，都写在本文件内
---

"helium.db":
  # ID 生成器
  idgen:
    snowflake:
      # 雪花ID-数据中心ID
      datacenter-id: ${DATACENTER_ID:0}
      # 雪花ID-起始日期-可以选用项目开工的日期-这个一旦确定就不要改动了
      epoch-date: '2026-07-17'
  # Mybatis-plus
  mybatis-plus:
    optimistic-lock:
      # 是否开启乐观锁
      enabled: true
  # 敏感字段加密
  field-crypto:
    # 数据加密根密钥
    data-root-key: ${FIELD_CRYPTO_DATA_ROOT_KEY:ggsW3SXKmnRvEYPYBt7lgvFqCWttwd+z3Yz1NUgpuHY=}
    # 盲索引根密钥，长周期使用
    index-root-key: ${FIELD_CRYPTO_INDEX_ROOT_KEY:IaYUq3c7/M6oaf5eTl/W0kcW0WjZA3gkdwRFU+H3dCc=}
    # 可用 keyId，轮换时加入例如 k2、k3等
    data-key-ids:
      - k1
    active-data-key-id: ${FIELD_CRYPTO_ACTIVE_DATA_KEY_ID:k1}
    canary:
      # 根密钥双指纹启动期对账，建议开启，避免错误的配置项，污染了 DB
      enabled: true
      # 轮换覆写维护开关，仅根密钥轮换时临时置 true，平时必须 false
      allow-overwrite: false

---
"helium.openapi3":
  nextdoc4j:
    enabled: true

---
"helium.tenant":
  # 多租户隔离策略
  isolation-strategy: NONE
  # 严格模式：子线程漏传租户上下文时直接报错，而非静默拼 NULL 查空
  strict: true
  # 数据表默认参与隔离，表必须有 tenant_id 列
  participate-by-default: true
  # 【行级】多租户忽略的表
  ignored-tables:
    # 系统菜单
    - sys_menu
    # 多租户
    - sys_user_tenant_relation
    - tenant_meta
    - tenant_package
    - tenant_package_menu_relation


---
"helium.bizlog":
  # 启用业务日志记录能力
  enabled: true
  # 操作日志 diff 忽略的敏感字段
  ignored-diff-fields:
    # 口令及凭据
    - pwd
    - initPwd
    - randomPassword
    - tenantAdminPwd
    # 文件存储点连接配置（含 AK/SK 等凭据）
    - settingBody
    - settingJson
    # 个人敏感信息
    - email
    - phoneNo
    # 昵称（P0 后仍明文，bizlog/日志脱敏先行覆盖，§5.5 / §7）
    - nickname
