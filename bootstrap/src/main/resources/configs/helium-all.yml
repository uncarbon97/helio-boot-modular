# Helium 框架层相关的配置，都写在本文件内
---

"helium.db":
  # ID 生成器
  idgen:
    snowflake:
      # 雪花ID-数据中心ID
      datacenter-id: ${DATACENTER_ID:0}
      # 雪花ID-起始日期-可以选用项目开工的日期-这个一旦确定就不要改动了
      epoch-date: '2026-07-17'
  # Mybatis-plus
  mybatis-plus:
    optimistic-lock:
      # 是否开启乐观锁
      enabled: true

---
"helium.openapi3":
  nextdoc4j:
    enabled: true

---
"helium.tenant":
  # 多租户隔离策略
  isolation-strategy: NONE
  # 严格模式：子线程漏传租户上下文时直接报错，而非静默拼 NULL 查空
  strict: true
  # 数据表默认参与隔离，表必须有 tenant_id 列
  participate-by-default: true
  # 【行级】多租户忽略的表
  ignored-tables:
    # 系统菜单
    - sys_menu
    # 登录日志：平台级审计，tenant_id 由业务显式写入（登录失败时可能无租户上下文）
    - sys_login_log
    # 多租户
    - sys_user_tenant_relation
    - tenant_meta
    - tenant_package
    - tenant_package_menu_relation


---
"helium.bizlog":
  # 启用业务日志记录能力
  enabled: true
