# 工程层相关的配置

--- # Spring Boot
spring:
  application:
    name: helium-monolith
  profiles:
    # 切换多环境；本地开发可以单独复制出来一个 local 环境配置文件，但不上传到 Git 服务器
    active: dev,local
  config:
    import:
      # 通过子配置拆分，提高可读性
      - classpath:configs/spring.yml
      - classpath:configs/helium-all.yml
      - classpath:configs/dependencies.yml

--- # 指定日志级别
logging:
  level:
    "cc.uncarbon.framework": INFO
    "cc.uncarbon.module": INFO
    "cc.uncarbon.test": INFO

--- # app-api
app-api:
  # 不进行登录校验的路由
  no-auth-paths:
    # 登录
    - /app/v1/auth/login

--- # admin-api
admin-api:
  file-hashids:
    salt: ${spring.application.name}
