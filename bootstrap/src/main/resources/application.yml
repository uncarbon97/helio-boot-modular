--- # Spring Boot
spring:
  application:
    name: helium-monolith
  profiles:
    # 可通过命令行参数实现多环境切换配置文件
    active: dev
  config:
    import:
      # 通过子配置拆分，提高可读性
      - classpath:configs/spring.yml
      - classpath:configs/framework.yml
      - classpath:configs/dependencies.yml

--- # 指定日志级别
logging:
  level:
    cc.uncarbon.framework: INFO
    cc.uncarbon.module: INFO
    cc.uncarbon.test: INFO

--- # app-api
app-api:
  # 不进行登录校验的路由
  no-auth-paths:
    # 登录
    - /app/v1/auth/login

--- # admin-api
admin-api:
  file-hashids:
    salt: ${spring.application.name}
