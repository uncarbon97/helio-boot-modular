# 工程层相关的配置
--- # 时区
# 数据时区；优先级：继承 helium-i18n 组件属性 > 系统属性 > 默认值
DB_TIMEZONE: ${helium.i18n.timezone.db-timezone:${user.timezone:Asia/Shanghai}}

--- # Spring Boot
spring:
  application:
    name: helium-monolith
  profiles:
    # 切换多环境；本地开发可以单独复制出来一个 local 环境配置文件，但不上传到 Git 服务器
    active: dev,local
  config:
    import:
      # 通过子配置拆分，提高可读性
      - classpath:configs/spring.yml
      - classpath:configs/helium-all.yml
      - classpath:configs/dependencies.yml
      - classpath:configs/helium-i18n.yml

--- # admin-api
admin-api:
  file-hashids:
    # 输出/解析 HashID 时使用的盐
    # 仅用于文件ID编解码（上传返回的 outFileId、下载路由 /file/download/v1/{hashIds}/{tenantCode}、UCenter 头像URL）
    # 变更影响：旧盐生成的 hashId 全部失效——已下发的下载链接、前端缓存的 outFileId 将无法解码，接口按文件不存在处理；
    #          数据库中文件记录不受影响，重新获取列表/上传结果即可拿到新 hashId
    # 变更后需保证所有实例配置一致，否则同一文件在不同实例编出不同 hashId
    # ❗ 安全提示：生产环境必须更换为随机强盐！下载接口为匿名访问，沿用默认盐会导致文件ID可被离线枚举、批量拉取
    salt: "replace-me-to-a-long-and-stronger-salt-value"
  login-challenge:
    # 登录挑战策略
    strategy: OCR
    ocr:
      answer-length: 4
      valid-seconds: 300
  login-failure-guard:
    # 登录失败限制（防撞库）
    max-failures: 5
    lock-seconds: 900

--- # app-api
app-api:
  # 不进行登录校验的路由
  no-auth-paths:
    # 登录
    - /app/v1/auth/login

--- # 日志
logging:
  file:
    # 日志文件落盘路径
    name: /logs/${spring.application.name}
  level:
    # 指定指定包的日志级别
    "cc.uncarbon.framework": INFO
    "cc.uncarbon.module": INFO
    "cc.uncarbon.test": INFO
    "org.springframework.web.servlet.PageNotFound": ERROR
