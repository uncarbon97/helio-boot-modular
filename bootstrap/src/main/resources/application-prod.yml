"helium.base":
  # 标识当前处于生产环境
  production-flag: true

"helium.openapi3":
  nextdoc4j:
    # 关闭文档生成
    enabled: false

---
spring:
  datasource:
    dynamic:
      datasource:
        primary: master
        # 主数据源
        master:
          url: jdbc:${MASTER_DB_TYPE:mysql}://${MASTER_DB_HOST:127.0.0.1}:${MASTER_DB_PORT:3306}/${MASTER_DB_NAME:helium}?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
          username: ${MASTER_DB_USERNAME:helium}
          password: ${MASTER_DB_PASSWORD:helium}
          lazy: false
  data:
    redis:
      # 连接主机
      host: 127.0.0.1
      # 连接端口
      port: 6379
      # 登录密码；如果没有设置密码，请注释掉下面这行，避免向 Redis-server 发送 AUTH 鉴权请求，引发程序启动失败
      password:
      # 数据库序号
      database: 1

---
mybatis-plus:
  configuration:
    # 生产环境下建议去除该配置项，不在控制台打印SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

---
dromara:
  x-file-storage:
    # 文档：https://x-file-storage.xuyanwu.cn/
    # 默认使用 local-plus-1 存储平台
    default-platform: local-plus-1
    # 缩略图后缀
    thumbnail-suffix: ".min.jpg"
    local-plus: # 本地存储升级版，不使用的情况下可以不写
      - platform: local-plus-1 # 存储平台标识
        enable-storage: true  #启用存储
        enable-access: false #启用访问（线上请使用 Nginx 配置，效率更高）
        domain: "" # 访问域名，例如：“http://127.0.0.1:8030/”，注意后面要和 path-patterns 保持一致，“/”结尾，本地存储建议使用相对路径，方便后期更换域名
        base-path: / # 基础路径
        path-patterns: /** # 访问路径
        storage-path: （实际本地存储路径，如 D:/local-plus-1） # 实际本地存储路径
    minio: # MinIO，由于 MinIO SDK 支持 AWS S3，其它兼容 AWS S3 协议的存储平台也都可配置在这里
      - platform: minio-1 # 存储平台标识
        enable-storage: true  # 启用存储
        access-key: （MinIO AK）
        secret-key: （MinIO SK）
        end-point: http://127.0.0.1:9000
        bucket-name: helium
        domain: http://127.0.0.1:9000/helium/ # 访问域名，注意“/”结尾，例如：http://minio.abc.com/abc/
        base-path: / # 基础路径
