"helium.base":
  # 标识当前处于生产环境
  production-flag: true

"helium.openapi3":
  nextdoc4j:
    # 关闭文档生成
    enabled: false

"helium.web":
  # 减少非必要日志量
  log-business-exception: false
  log-expected-exception: false

---
spring:
  datasource:
    dynamic:
      primary: mysql
      datasource:
        # MySQL 数据源
        mysql:
          url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB_NAME:helium}?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=${DB_TIMEZONE}
          username: ${MYSQL_USERNAME:helium}
          password: ${MYSQL_PASSWORD:helium}
          # 设置 false 会在工程启动时就初始化数据源
          lazy: false
        # PG 数据源
        postgres:
          url: jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5432}/${PG_DB_NAME:helium}?reWriteBatchedInserts=true&TimeZone=${DB_TIMEZONE}
          username: ${PG_USERNAME:helium}
          password: ${PG_PASSWORD:helium}
          lazy: true
  data:
    redis:
      # Redis 主机
      host: ${REDIS_HOST:127.0.0.1}
      # Redis 端口
      port: ${REDIS_PORT:6379}
      # 如果没有设置密码，下面这行直接注释掉，避免向 Redis-server 发送 AUTH 鉴权请求，引发程序启动失败
      password: ${REDIS_PASSWORD}
      # Redis 数据库序号
      database: ${REDIS_DATABASE:0}

---
"sys.ip2region":
  # 是否启用 ip2region 离线IP归属地查询
  # 详见 resources/ip2region/README.md
  enabled: false

---
"helium.db.field-crypto":
  # 生产环境密钥必须由环境变量/KMS 注入，不提供默认值（缺失时启动失败，fail-closed）
  data-root-key: ${FIELD_CRYPTO_DATA_ROOT_KEY}
  data-key-ids:
    - ${FIELD_CRYPTO_DATA_KEY_ID_K1:k1}
  active-data-key-id: ${FIELD_CRYPTO_ACTIVE_DATA_KEY_ID:k1}
  index-root-key: ${FIELD_CRYPTO_INDEX_ROOT_KEY}
  # 禁用根密钥清单（fail-closed，任务 1.3）：已提交进仓库的 dev 默认值，生产命中即拒启（等价密钥公开）
  forbidden-root-keys:
    - ggsW3SXKmnRvEYPYBt7lgvFqCWttwd+z3Yz1NUgpuHY=
    - IaYUq3c7/M6oaf5eTl/W0kcW0WjZA3gkdwRFU+H3dCc=
  canary:
    enabled: true
    allow-overwrite: false

---

# actuator 端点收口（方案 §5.5 第 5 条 / 任务 2.12）：heapdump/env 等为密钥/明文直读面
management:
  endpoints:
    web:
      exposure:
        # 生产端点白名单：禁 heapdump/threaddump/env/configprops/beans
        include: health,info,metrics
  endpoint:
    env:
      show-values: NEVER
    configprops:
      show-values: NEVER
    beans:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
