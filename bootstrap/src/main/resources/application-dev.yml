spring:
  datasource:
    dynamic:
      primary: mysql
      datasource:
        # MySQL 数据源
        mysql:
          url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB_NAME:helium}?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=${DB_TIMEZONE}
          username: ${MYSQL_USERNAME:helium}
          password: ${MYSQL_PASSWORD:helium}
          # 设置 false 会在工程启动时就初始化数据源
          lazy: false
        # PG 数据源
        postgres:
          url: jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5432}/${PG_DB_NAME:helium}?reWriteBatchedInserts=true&TimeZone=${DB_TIMEZONE}
          username: ${PG_USERNAME:helium}
          password: ${PG_PASSWORD:helium}
          lazy: true
      # HikariCP 全局默认配置
      hikari:
        # 虚拟线程环境下，适当提高连接数，但不要无限拉高，数据库端连接是有限的
        maximum-pool-size: 50
        minimum-idle: 5
        # 连接等待超时适当缩短，快速失败而非长时间堵塞
        connection-timeout: 5000
        # 泄漏定位阈值
        leak-detection-threshold: 30000
        # 长连接空闲被防火墙/云负载均衡切断的常见场景，主动 ping 续命
        keepalive-time: 300000
        # 连接最大生命周期，防止数据库侧超时
        max-lifetime: 1800000
        # 连接验证超时
        validation-timeout: 4000
        connection-test-query: "SELECT 1"
  data:
    redis:
      # Redis 主机
      host: ${REDIS_HOST:127.0.0.1}
      # Redis 端口
      port: ${REDIS_PORT:6379}
      # 如果没有设置密码，下面这行直接注释掉，避免向 Redis-server 发送 AUTH 鉴权请求，引发程序启动失败
#      password: ""
      # Redis 数据库序号
      database: ${REDIS_DATABASE:0}

---
mybatis-plus:
  configuration:
    # 生产环境下建议去除该配置项，不在控制台打印SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

---
dromara:
  x-file-storage:
    # 文档：https://x-file-storage.xuyanwu.cn/
    # 默认使用 local-plus-1 存储平台
    default-platform: local-plus-1
    # 缩略图后缀
    thumbnail-suffix: ".min.jpg"
    local-plus: # 本地存储升级版，不使用的情况下可以不写
      - platform: local-plus-1 # 存储平台标识
        enable-storage: true  #启用存储
        enable-access: false #启用访问（线上请使用 Nginx 配置，效率更高）
        domain: "" # 访问域名，例如：“http://127.0.0.1:8030/”，注意后面要和 path-patterns 保持一致，“/”结尾，本地存储建议使用相对路径，方便后期更换域名
        base-path: / # 基础路径
        path-patterns: /** # 访问路径
        storage-path: （实际本地存储路径，如 D:/local-plus-1） # 实际本地存储路径
    minio: # MinIO，由于 MinIO SDK 支持 AWS S3，其它兼容 AWS S3 协议的存储平台也都可配置在这里
      - platform: minio-1 # 存储平台标识
        enable-storage: true  # 启用存储
        access-key: （MinIO AK）
        secret-key: （MinIO SK）
        end-point: http://127.0.0.1:9000
        bucket-name: helium
        domain: http://127.0.0.1:9000/helium/ # 访问域名，注意“/”结尾，例如：http://minio.abc.com/abc/
        base-path: / # 基础路径
