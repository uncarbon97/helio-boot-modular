# 集成测试专用 profile
# 假定外部 DB/Redis 已启动；按实际测试环境修改以下连接信息。
# @ActiveProfiles("test") 会覆盖 application.yml 中的 dev,local，故数据源/Redis/文件存储必须在此提供。

---
spring:
  datasource:
    dynamic:
      primary: it
      datasource:
        # 集成测试专用数据源
        it:
          url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:helium}?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=${DB_TIMEZONE}
          username: ${DB_USERNAME:helium}
          password: ${DB_PASSWORD:helium}
          # 设置 false 会在工程启动时就初始化数据源
          lazy: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: 6379
      # 未设密码请保持注释，避免向 Redis 发送 AUTH 引发启动失败
      # password:
      database: 2

---
# 多租户：四种组合（隔离策略 × 登录模式）用环境变量切换
# LINE + TENANT_FIRST 为默认；DATASOURCE 需要额外配置租户数据源路由后再切换
"helium.tenant":
  isolation-strategy: ${HELIUM_TENANT_ISOLATION_STRATEGY:LINE}
  login-mode: ${HELIUM_TENANT_LOGIN_MODE:TENANT_FIRST}

---
mybatis-plus:
  configuration:
    # 测试环境下打印 SQL，便于排查
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

---
# 文件存储（全量上下文启动需要；与 application-dev.yml 对齐，使用本地存储）
dromara:
  x-file-storage:
    default-platform: local-plus-1
    thumbnail-suffix: ".min.jpg"
    local-plus:
      - platform: local-plus-1
        enable-storage: true
        enable-access: false
        domain: ""
        base-path: /
        path-patterns: /**
        # TODO 按实际测试环境改为可写目录
        storage-path: ./target/it-file-storage
